name: probe release perms
on: push
permissions:
  contents: write
jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[pages]')"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          note() { echo "::$1 title=$2::$(echo "$3" | tail -n 6 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; }
          id=$(gh api repos/$R/releases/tags/v1.2.0 --jq .id)
          name=$(gh api repos/$R/releases/tags/v1.2.0 --jq .name)
          out=$(gh api -X PATCH repos/$R/releases/$id -f name="$name" --jq .name 2>&1) && note notice patch-existing-ok "$out" || note error patch-existing "$out"
          out=$(gh api repos/$R/actions/permissions/workflow 2>&1); note notice workflow-perms "$out"
          out=$(gh api repos/$R --jq '{visibility, archived, permissions}' 2>&1); note notice repo "$out"
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git commit -q --allow-empty -m "[pages] push test" && (git push -q 2>&1 && note notice git-push-ok ok || note error git-push "$(git push 2>&1)")
