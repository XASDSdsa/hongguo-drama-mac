name: probe release create
on: push
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - run: |
          note() { echo "::$1 title=$2::$(echo "$3" | tail -n 12 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; }
          out=$(gh release view v1.2.1 -R "$R" 2>&1) && note notice view-ok "$out" || note warning view "$out"
          echo test > probe-check.txt
          if out=$(gh release create v1.2.1 probe-check.txt -R "$R" --prerelease --target e2babe4882c8a4889f4e68f6463abbfd49357e55 --title "AI短剧助手 1.2.1" --notes "AI短剧助手 1.2.1（e2babe4882c8a4889f4e68f6463abbfd49357e55）。" 2>&1); then
            note notice create-ok "$out"
            out=$(gh release delete-asset v1.2.1 probe-check.txt -R "$R" -y 2>&1); note notice delete-asset "$out"
          else
            note error create-failed "$out"
            out=$(gh api repos/$R/releases -f tag_name=v1.2.1-apitest -f target_commitish=e2babe4882c8a4889f4e68f6463abbfd49357e55 -F draft=true 2>&1) && { note notice api-draft-ok "$(echo "$out" | head -c 300)"; id=$(echo "$out" | jq -r .id); gh api -X DELETE repos/$R/releases/$id; } || note error api-draft "$out"
          fi
