name: probe hongguo resolution
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: perf/structure-speed, path: app }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: npm init -y >/dev/null && npm i -q axios@1 >/dev/null
      - run: node probe.js
