name: probe mac checks
on: push
jobs:
  mac:
    if: "!contains(github.event.head_commit.message, '[pages]')"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: perf/structure-speed }
      - uses: actions/setup-node@v4
        with: { node-version: 22.12.0 }
      - shell: bash {0}
        run: |
          npm i --no-save axios@1 >/dev/null 2>&1
          note() { echo "::$1 title=$2::$(echo "$3" | tail -n 14 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; }
          for c in check-draft-capacity check-catalog check-hot-rank-live; do
            out=$(node scripts/$c.cjs 2>&1); code=$?
            [ $code -eq 0 ] && note notice "ok $c" "$out" || note error "FAIL $c ($code)" "$out"
          done
          note notice sysctl "$(sysctl -n hw.perflevel0.physicalcpu hw.physicalcpu hw.ncpu 2>&1)"
