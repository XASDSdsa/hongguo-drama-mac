name: probe release from tag
on: push
permissions:
  contents: write
jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[pages]')"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      SHA: e2babe4882c8a4889f4e68f6463abbfd49357e55
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          note() { echo "::$1 title=$2::$(echo "$3" | tail -n 6 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; }
          git fetch -q origin perf/structure-speed
          out=$(git push origin "$SHA:refs/tags/v1.2.1" 2>&1) && note notice tag-push-ok "$out" || note error tag-push "$out"
          echo test > probe-check.txt
          if out=$(gh release create v1.2.1 probe-check.txt -R "$R" --verify-tag --prerelease --title "AI短剧助手 1.2.1" --notes "AI短剧助手 1.2.1（$SHA）。" 2>&1); then
            note notice create-ok "$out"
            out=$(gh release delete-asset v1.2.1 probe-check.txt -R "$R" -y 2>&1); note notice delete-asset "$out"
          else
            note error create-failed "$out"
          fi
