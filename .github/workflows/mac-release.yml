name: macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to receive the macOS asset (leave empty to only keep a workflow artifact). Never v1.1.30.
        required: false
        default: ''
      ref:
        description: Branch, tag or commit to build. Defaults to the tag when one is given, otherwise main.
        required: false
        default: ''
  # Build this branch's Apple Silicon DMG. Do not check out or upload to v1.1.30.
  push:
    branches:
      - cursor/breath-on-shot-cut-10fe

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Refuse the official v1.1.30 release
        if: github.event_name == 'workflow_dispatch' && inputs.tag == 'v1.1.30'
        run: |
          echo "Refusing to build or upload onto the 2026-10-13 v1.1.30 release."
          exit 1

      - name: Check out the requested revision
        uses: actions/checkout@v5
        with:
          # A manual dispatch builds the requested tag. A push of this branch
          # builds that commit and must not fall back to v1.1.30.
          ref: ${{ github.event_name == 'push' && github.sha || inputs.ref || inputs.tag || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Refuse to publish a version number that was already released
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          # 每次更新都要换版本号：同一版本号已经发过安装包，就不再打包，免得分不清装的是哪一版。
          if gh release view "v${version}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "ai-drama-assistant-${version}-mac-arm64.dmg"; then
            echo "::error title=版本号已发布过::v${version} 已经有 Mac 安装包。请先在 package.json 里把版本号改成新的再打包。"
            exit 1
          fi
          if [ "${{ inputs.tag }}" != "v${version}" ]; then
            echo "::error title=发布页和版本号不一致::package.json 是 ${version}，发布页填的是 ${{ inputs.tag }}，应为 v${version}。"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Set up build-only Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: arm64

      - name: Bundle offline subtitle engine and tiny model
        run: |
          npm run setup:transcription
          npm run check:transcription-bundle

      - name: Bundle offline video structure runtime
        run: |
          npm run setup:structure
          npm run check:structure-bundle
          npm run check:structure

      - name: Prepare Apple Silicon FFmpeg
        run: node scripts/setup-ffmpeg-mac.js

      - name: Check processing with bundled macOS FFmpeg
        env:
          FFMPEG_PATH: ${{ github.workspace }}/build/ffmpeg/darwin-arm64/ffmpeg
          FFPROBE_PATH: ${{ github.workspace }}/build/ffmpeg/darwin-arm64/ffprobe
        run: |
          "$FFMPEG_PATH" -version
          # 每条检查失败时，把输出末尾写成注释，不用打开完整日志就能看到原因。
          run_check() {
            if ! "$@" >check.out 2>&1; then
              cat check.out
              message=$(tail -n 25 check.out | head -c 3500 | awk '{printf "%s%%0A", $0}')
              echo "::error title=$*::$message"
              exit 1
            fi
            cat check.out
          }
          export PATH="$(dirname "$FFMPEG_PATH"):$PATH"
          run_check node scripts/check-quchong.cjs
          run_check node scripts/check-quchong-size.cjs
          run_check node scripts/check-quchong-sources.cjs
          run_check node scripts/check-dedup-defaults.cjs
          run_check node scripts/check-resplit.cjs
          run_check node scripts/check-dedup-timestamps.cjs
          run_check node scripts/check-scene-hwaccel.cjs
          run_check node scripts/check-jianying-relink.cjs
          run_check node scripts/check-separation-ascii.cjs
          run_check env REQUIRE_STRUCTURE_RUNTIME=1 node scripts/check-separation-real.cjs
          run_check node scripts/check-encoder-retry.cjs
          run_check npm run check:subtitles
          run_check python scripts/check-subtitle-alignment.py
          run_check npm run check:premium

      - name: Build local whisper.cpp and prepare tiny model
        shell: bash
        run: |
          set -euo pipefail
          WHISPER_REF=v1.9.3
          src="$RUNNER_TEMP/whisper.cpp"
          build="$RUNNER_TEMP/whisper-build"
          git clone --depth 1 --branch "$WHISPER_REF" https://github.com/ggml-org/whisper.cpp.git "$src"
          cmake -S "$src" -B "$build" -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_BLAS=OFF -DGGML_OPENMP=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DCMAKE_OSX_ARCHITECTURES=arm64 -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$build" --config Release --target whisper-cli -j 3
          bin=$(find "$build" -type f -name whisper-cli -perm -111 | head -n 1)
          test -n "$bin"
          mkdir -p build/whisper/darwin-arm64 build/whisper/models
          curl -L --retry 4 --fail https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin -o build/whisper/models/ggml-tiny.bin
          echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  build/whisper/models/ggml-tiny.bin" | shasum -a 256 -c -
          cp "$src/LICENSE" build/whisper/WHISPER-LICENSE.txt
          WHISPER_CPP_BIN="$bin" WHISPER_CPP_MODEL="$PWD/build/whisper/models/ggml-tiny.bin" node scripts/setup-whisper.js
          build/ffmpeg/darwin-arm64/ffmpeg -hide_banner -loglevel error -f lavfi -i anullsrc=r=16000:cl=mono -t 1 -c:a pcm_s16le "$RUNNER_TEMP/whisper-smoke.wav"
          build/whisper/darwin-arm64/whisper-cli -m build/whisper/models/ggml-tiny.bin -f "$RUNNER_TEMP/whisper-smoke.wav" -ng -t 2 -nt -np -l en

      - name: Run macOS-safe checks
        shell: bash
        run: |
          set -e
          # 哪一项检查失败，就把那条命令写进打包页面的提示里（日志看不到时也能一眼知道是谁）。
          trap 'echo "::error title=检查失败::$BASH_COMMAND"' ERR
          node scripts/check-undefined-names.cjs
          node scripts/check-hot-rank-live.cjs
          node scripts/check-catalog.cjs
          node scripts/check-download-series.cjs
          node scripts/check-download-errors.cjs
          node scripts/check-pagination.cjs
          node scripts/check-library-activity.cjs
          node scripts/check-series-library.cjs
          node scripts/check-draft-lanes.cjs
          node scripts/check-draft-capacity.cjs
          node scripts/check-storyboard-reuse.cjs
          node scripts/check-originals-folder.cjs
          node scripts/check-app-rename.cjs
          node scripts/check-ai-network-errors.cjs
          REQUIRE_WHISPER=1 node scripts/check-whisper-real.cjs
          node scripts/check-jianying-simple-draft.cjs
          node scripts/check-download-safety.cjs
          node scripts/check-series-episode-panel.cjs
          node scripts/check-quchong-queue.cjs
          node scripts/check-renderer-lifecycle.cjs
          node scripts/check-quit-confirm.cjs
          node scripts/check-download-index.cjs
          node scripts/check-pipeline-gate.cjs
          node scripts/check-whisper-adapter.cjs
          npm run check:ai

      - name: Build macOS DMG
        run: npm run build:mac

      - name: Check packaged subtitle engine without system Python
        run: node scripts/check-bundled-transcription.cjs "dist/mac-arm64/AI短剧助手.app/Contents/Resources"

      - name: End to end with the bundled components (Chinese names)
        env:
          FFMPEG_PATH: ${{ github.workspace }}/build/ffmpeg/darwin-arm64/ffmpeg
          FFPROBE_PATH: ${{ github.workspace }}/build/ffmpeg/darwin-arm64/ffprobe
          REQUIRE_E2E: '1'
        run: node scripts/check-draft-e2e.cjs

      - name: Measure how fast the packaged app opens
        shell: bash
        run: |
          set -euo pipefail
          exe="dist/mac-arm64/AI短剧助手.app/Contents/MacOS/AI短剧助手"
          for run in 1 2; do
            out="$RUNNER_TEMP/startup-$run.json"
            rm -f "$out"
            AI_DRAMA_STARTUP_PROBE="$out" "$exe" > "$RUNNER_TEMP/startup-$run.log" 2>&1 &
            pid=$!
            for i in $(seq 1 120); do [ -s "$out" ] && break; sleep 1; done
            wait "$pid" || true
            [ -s "$out" ] || { echo "the app did not open within 120 s (run $run)" >&2; cat "$RUNNER_TEMP/startup-$run.log" >&2 || true; exit 1; }
            echo "::notice title=startup run $run (ms since process start)::$(cat "$out")"
          done
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); if(!(r.pageLoaded<15000)){console.error('opening took', r.pageLoaded, 'ms'); process.exit(1)}" "$RUNNER_TEMP/startup-2.json"

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist/release
          version=$(node -p "require('./package.json').version")
          cp "dist/AI短剧助手-${version}-mac-arm64.dmg" "dist/release/ai-drama-assistant-${version}-mac-arm64.dmg"
          shasum -a 256 "dist/release/ai-drama-assistant-${version}-mac-arm64.dmg" > "dist/release/ai-drama-assistant-${version}-mac-arm64.sha256"

      - name: Upload macOS assets to the release
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.tag }}" = "v1.1.30" ]; then
            echo "refusing to publish onto the official v1.1.30 release" >&2
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          bash scripts/create-release-page.sh "${{ inputs.tag }}" "AI短剧助手 ${version}" "AI短剧助手 ${version}（软件代码 ${GITHUB_SHA}）。"
          gh release upload "${{ inputs.tag }}" dist/release/* --repo "${{ github.repository }}" --clobber

      - name: Publish branch DMG without touching v1.1.30
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          if [ "$tag" = "v1.1.30" ]; then
            echo "refusing to publish onto the official v1.1.30 release" >&2
            exit 1
          fi
          notes="Apple Silicon DMG from ${GITHUB_SHA} on ${GITHUB_REF_NAME}. Package version ${tag#v}. The 2026-10-13 v1.1.30 release and its assets are left unchanged."
          bash scripts/create-release-page.sh "$tag" "AI短剧助手 ${tag#v}" "$notes"
          gh release upload "$tag" dist/release/* --repo "${{ github.repository }}" --clobber

      - name: Keep a workflow artifact copy
        uses: actions/upload-artifact@v6
        with:
          name: ai-drama-assistant-${{ inputs.tag || github.sha }}-macos
          path: dist/release/*
