name: macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release to receive the complete DMG; empty keeps an artifact only.
        required: false
        default: ''
      ref:
        description: Exact source branch, tag or commit.
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Fetch the accepted complete Mac runtime baseline
        uses: actions/download-artifact@v7
        with:
          name: ai-drama-assistant-v1.2.38-macos
          run-id: 42785018549
          github-token: ${{ github.token }}
          path: dist/accepted-mac
      - name: Restore unchanged Mac components without rebuilding runtimes
        run: node scripts/reuse-mac-runtimes.cjs dist/accepted-mac
      - name: Fetch the verified platform-independent player core
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download windows-patch-baseline-1.2.51 --repo "${{ github.repository }}" --pattern 'changeFileName-1.2.51-patch-baseline.zip' --dir build/hongguo-player
      - name: Prepare native Apple Silicon download runtime
        run: node scripts/setup-hongguo-player-mac.cjs build/hongguo-player/changeFileName-1.2.51-patch-baseline.zip
      - name: Build the latest complete Mac application and DMG
        run: |
          ulimit -n 65536 2>/dev/null || ulimit -n 10240
          npm run build:react
          node scripts/build-mac-dmg.cjs
      - name: Verify the packaged application and disk image
        run: |
          product=$(node -p "require('./package.json').build.productName")
          version=$(node -p "require('./package.json').version")
          node scripts/check-mac-package.cjs "dist/mac-arm64/${product}.app"
          hdiutil verify "dist/${product}-${version}-mac-arm64.dmg"
          mkdir -p dist/release
          cp "dist/${product}-${version}-mac-arm64.dmg" dist/release/
          cp dist/mac-package-acceptance.json dist/release/
          (cd dist/release && shasum -a 256 "${product}-${version}-mac-arm64.dmg" > "${product}-${version}-mac-arm64.sha256")
      - name: Upload to the requested draft release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          [ "$RELEASE_TAG" = "v${version}" ] && [ "$RELEASE_TAG" != v1.1.30 ]
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft | grep -qx true
          gh release upload "$RELEASE_TAG" dist/release/* --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v7
        with:
          name: changeFileName-mac-arm64-full
          path: dist/release/*
          compression-level: 0
          retention-days: 30
