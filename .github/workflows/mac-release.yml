name: macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to receive the macOS asset
        required: true
        default: v1.1.15

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Apple Silicon FFmpeg
        run: node scripts/setup-ffmpeg-mac.js

      - name: Build local whisper.cpp and prepare tiny model
        shell: bash
        run: |
          set -euo pipefail
          WHISPER_REF=v1.9.3
          src="$RUNNER_TEMP/whisper.cpp"
          build="$RUNNER_TEMP/whisper-build"
          git clone --depth 1 --branch "$WHISPER_REF" https://github.com/ggml-org/whisper.cpp.git "$src"
          cmake -S "$src" -B "$build" -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$build" --config Release --target whisper-cli -j 3
          bin=$(find "$build" -type f -name whisper-cli -perm -111 | head -n 1)
          test -n "$bin"
          mkdir -p build/whisper/darwin-arm64 build/whisper/models
          curl -L --retry 4 --fail https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin -o build/whisper/models/ggml-tiny.bin
          echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  build/whisper/models/ggml-tiny.bin" | shasum -a 256 -c -
          cp "$src/LICENSE" build/whisper/WHISPER-LICENSE.txt
          WHISPER_CPP_BIN="$bin" WHISPER_CPP_MODEL="$PWD/build/whisper/models/ggml-tiny.bin" node scripts/setup-whisper.js

      - name: Run macOS-safe checks
        run: |
          node scripts/check-download-manager.cjs
          node scripts/check-download-series.cjs
          node scripts/check-download-safety.cjs
          node scripts/check-series-episode-panel.cjs
          node scripts/check-pipeline-gate.cjs
          node scripts/check-whisper-adapter.cjs
          npm run check:ai

      - name: Build macOS DMG
        run: npm run build:mac

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist/release
          version=$(node -p "require('./package.json').version")
          cp "dist/红果短剧-${version}-mac-arm64.dmg" "dist/release/hongguo-downloader-${version}-mac-arm64.dmg"
          shasum -a 256 "dist/release/hongguo-downloader-${version}-mac-arm64.dmg" > "dist/release/hongguo-downloader-${version}-mac-arm64.sha256"

      - name: Upload macOS assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/release/* --repo "${{ github.repository }}" --clobber

      - name: Keep a workflow artifact copy
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-downloader-${{ inputs.tag }}-macos
          path: dist/release/*
