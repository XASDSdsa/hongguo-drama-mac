name: Windows build
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Frozen source ref
        default: '8929206a288c8aa0e23098befbec9c37cdb5e42a'
        required: false
permissions:
  contents: read
jobs:
  live-download:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
      - run: npm ci --ignore-scripts
      - name: Check real source and complete media transfer
        run: node scripts/diagnose-download-live.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-download-live-1.2.47
          path: download-live-results/report.json

