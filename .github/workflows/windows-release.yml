name: Windows build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build.
        required: false
        default: ''
      tag:
        description: Existing GitHub release tag to receive the Windows assets (empty = keep only a workflow artifact). Never v1.1.30.
        required: false
        default: ''
      artifact_run:
        description: Skip the build; publish the hongguo-windows artifact of this earlier run id to the tag.
        required: false
        default: ''
      ffmpeg_only:
        description: "Only build the bundled Windows FFmpeg (NVENC 11.1, NVIDIA driver 471.41+) and keep it as an artifact."
        required: false
        default: ''
      quick:
        description: "true = 只出 Windows 快速更新包，沿用已安装的运行库。"
        required: false
        default: ''
      native_verify_run:
        description: "Validate the packaged native download pipeline from this build artifact run."
        required: false
        default: ''
      installer_verify_run:
        description: "Verify a complete NSIS installer artifact on a clean Windows machine."
        required: false
        default: ''
      installer_only:
        description: "true = 构建并检查完整安装程序，跳过额外的绿色版 ZIP。"
        required: false
        default: ''
      repack_from_installer_run:
        description: "Reuse the accepted 1.2.49 installer runtimes and build/test the in-app-update installer after a quick build."
        required: false
        default: ''
      quick_artifact_run:
        description: "Reuse an already verified quick-update artifact when rebuilding only the automatic-update installer."
        required: false
        default: ''

permissions:
  actions: read
  contents: write

jobs:
  build-ffmpeg:
    if: inputs.ffmpeg_only == 'true' && inputs.quick != 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0

      - name: Install native compiler tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git curl tar gzip xz zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf

      - name: Build static FFmpeg from pinned sources
        id: helpers
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg-source-win.sh /c/ffmpeg-compat-build 4

      - name: Exercise real Windows processing with the new FFmpeg
        shell: bash
        env:
          FFMPEG_PATH: C:/ffmpeg-compat-build/artifacts/ffmpeg-9.0.2-nvenc11.1-win-x64/bin/ffmpeg.exe
          FFPROBE_PATH: C:/ffmpeg-compat-build/artifacts/ffmpeg-9.0.2-nvenc11.1-win-x64/bin/ffprobe.exe
        run: |
          set -e
          npm ci --ignore-scripts
          export PATH="/c/ffmpeg-compat-build/artifacts/ffmpeg-9.0.2-nvenc11.1-win-x64/bin:$PATH"
          "$FFMPEG_PATH" -hide_banner -version | head -n 1
          # 没有 NVIDIA 显卡的打包机上，NVENC 试编应报「找不到驱动」，而不是参数错误。
          "$FFMPEG_PATH" -hide_banner -v error -f lavfi -i color=c=black:s=256x256:d=0.2 -frames:v 1 -pix_fmt yuv420p -c:v h264_nvenc -preset p1 -cq 21 -f null - 2>&1 | head -n 5 || true
          node scripts/check-quchong.cjs
          node scripts/check-dedup-timestamps.cjs
          node scripts/check-resplit.cjs

      - name: Keep binaries and corresponding source
        if: always() && steps.helpers.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-9.0.2-nvenc11.1-win-x64
          path: |
            C:/ffmpeg-compat-build/artifacts/*.zip
            C:/ffmpeg-compat-build/artifacts/*.tar.xz
            C:/ffmpeg-compat-build/artifacts/*.sha256
            C:/ffmpeg-compat-build/artifacts/*/BUILD-REPORT.txt
          if-no-files-found: error
          retention-days: 90

      - name: Keep build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-compat-build-logs
          path: |
            C:/ffmpeg-compat-build/logs
            C:/ffmpeg-compat-build/build-ffmpeg/ffbuild/config.log
          if-no-files-found: ignore

  # 快速更新包包含配套的 Windows EXE 和 ASAR，保留应用完整性校验。
  # 运行库（FFmpeg、剪映运行时、模型）没变时用它；运行库变了要出完整安装包。
  # 快速更新也要在真 Windows 上过一遍剪映草稿：用打包时同一个 pyJianYingDraft 和发布过的 Windows FFmpeg，
  # 实际生成一份三分轨草稿（中文路径），核对 Windows 版剪映读的 draft_content.json 等。几分钟，不打安装包。
  quick-windows-check:
    if: inputs.quick == 'true' && inputs.quick_artifact_run == ''
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install pyJianYingDraft and the bundled Windows FFmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r scripts/jianying-requirements.txt
          mkdir -p "$RUNNER_TEMP/ff"
          gh release download v1.2.6 --repo "${{ github.repository }}" -p 'ffmpeg-*-win-x64.zip' -D "$RUNNER_TEMP/ff"
          (cd "$RUNNER_TEMP/ff" && 7z x -y -bd ffmpeg-*-win-x64.zip > /dev/null)
          ff=$(find "$RUNNER_TEMP/ff" -iname ffmpeg.exe | head -n 1)
          [ -n "$ff" ] || { echo "::error title=没有 FFmpeg::release zip 里没找到 ffmpeg.exe"; exit 1; }
          echo "FFMPEG_PATH=$(cygpath -w "$ff")" >> "$GITHUB_ENV"
          cygpath -w "$(dirname "$ff")" >> "$GITHUB_PATH"

      - name: Jianying draft checks on Windows
        shell: bash
        run: |
          set -euo pipefail
          run_check() { if ! "$@" > "$RUNNER_TEMP/c.log" 2>&1; then echo "::error title=Windows 检查没过：$*::$(tail -n 25 "$RUNNER_TEMP/c.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; fi; tail -n 3 "$RUNNER_TEMP/c.log"; }
          run_check node scripts/check-jianying-relink.cjs
          run_check node scripts/check-jianying-location.cjs
          run_check env PYTHON=python REQUIRE_JIANYING=1 node scripts/check-jianying-simple-draft.cjs
          run_check python scripts/check-dialogue-draft.py
          # 分析切点的镜头切换检测：D3D11（显卡解码 + 显卡缩小）→ -hwaccel auto → CPU，用真的 ffmpeg.exe 走一遍
          run_check node scripts/check-scene-hwaccel.cjs
          grep '^::notice' "$RUNNER_TEMP/c.log" || true

  quick-update:
    if: inputs.quick == 'true' && inputs.quick_artifact_run == ''
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm

      - name: Verify release target
        if: inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$version" -or $env:RELEASE_TAG -eq 'v1.1.30') { throw "Expected release tag v$version" }
          $release = gh release view $env:RELEASE_TAG --json isDraft,assets,targetCommitish | ConvertFrom-Json
          if (!$release.isDraft -or $release.assets.Count -or $release.targetCommitish -ne (git rev-parse HEAD)) {
            throw 'A new draft release targeting this commit is required'
          }

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: npm ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and verify the app-local native playback resolver
        run: npm run setup:hongguo-player

      - name: Check cost reports and build the Windows package
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/check-undefined-names.cjs
          node scripts/check-cost-report.cjs
          node scripts/check-app-updates.cjs
          python scripts/check-update-server.py
          node scripts/check-app-source.cjs
          node scripts/check-native-player.cjs
          node scripts/check-hongguo-player.cjs --live
          node src/components/check-ui-state.cjs
          node scripts/check-cost-report-image.cjs
          node scripts/check-series-library.cjs
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/quick-update/update.ps1'), [ref]$null, [ref]$errors)
          if ($errors) { throw ($errors -join "`n") }
          npm run build:react
          node scripts/make-quick-update.cjs dist/quick
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Get-ChildItem dist/quick/*-update.zip -ErrorAction SilentlyContinue)) { throw 'Quick update package was not produced' }

      - uses: actions/cache/restore@v4
        id: wps-installer
        with:
          path: ${{ runner.temp }}/WPS_Setup_29690.exe
          key: wps-cn-29690-e3a12702-windows

      - name: Install WPS on the disposable Windows test machine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'WPS_Setup_29690.exe'
          if (!(Test-Path $installer)) {
            $chunks = Join-Path $env:RUNNER_TEMP 'wps-download-parts'
            New-Item -ItemType Directory -Force -Path $chunks | Out-Null
            $size = 311844128
            $partSize = 8388608
            $count = [int][Math]::Ceiling($size / $partSize)
            0..($count - 1) | ForEach-Object -Parallel {
              $start = $_ * $using:partSize
              $end = [Math]::Min($using:size - 1, $start + $using:partSize - 1)
              $output = Join-Path $using:chunks "$_.part"
              & curl.exe --fail --location --retry 1 --max-time 120 --silent --show-error --range "$start-$end" 'https://official-package.wpscdn.cn/wps/download/WPS_Setup_29690.exe' --output $output
              if ($LASTEXITCODE -ne 0) { throw "WPS download part $_ failed" }
            } -ThrottleLimit 20
            $joined = [IO.File]::Create($installer)
            try {
              for ($part = 0; $part -lt $count; $part++) {
                $piece = Join-Path $chunks "$part.part"
                $expected = [Math]::Min($partSize, $size - $part * $partSize)
                if (!(Test-Path $piece) -or (Get-Item $piece).Length -ne $expected) { throw "Incomplete WPS part $part" }
                $stream = [IO.File]::OpenRead($piece)
                try { $stream.CopyTo($joined) } finally { $stream.Dispose() }
              }
            } finally { $joined.Dispose() }
          }
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne 'E3A12702BA1196654C6454D2881ABBE903EF71019D0342127845D76A12F8C120') { throw 'WPS installer hash mismatch' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Kingsoft') { throw 'WPS signature check failed' }
          $destination = Join-Path $env:RUNNER_TEMP 'wps-test'
          $setup = Start-Process -FilePath $installer -ArgumentList @('/S', '-agreelicense', "/D=$destination") -PassThru
          if (!$setup.WaitForExit(180000)) { Stop-Process -Id $setup.Id -Force; throw 'WPS install timed out' }
          if ($setup.ExitCode -ne 0) { throw "WPS install failed $($setup.ExitCode)" }
          # This is an empty disposable runner, with no user documents.
          Get-Process -Name wps,wpsoffice,wpscenter -ErrorAction SilentlyContinue | Stop-Process -Force
          $errors = $null
          $source = Get-Content 'src/native/cost-report/wps.js' -Raw
          $start = $source.IndexOf('String.raw' + [char]96) + 11
          $end = $source.IndexOf([char]96 + ';', $start)
          [void][System.Management.Automation.Language.Parser]::ParseInput($source.Substring($start, $end - $start), [ref]$null, [ref]$errors)
          if ($errors) { throw ($errors -join "`n") }

      - uses: actions/cache/save@v4
        if: steps.wps-installer.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/WPS_Setup_29690.exe
          key: wps-cn-29690-e3a12702-windows

      - name: Verify the complete WPS to final PNG pipeline
        shell: pwsh
        run: |
          & ./node_modules/.bin/electron.cmd scripts/check-office-png.cjs --wps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wps-report-acceptance
          path: dist/report-qa
          if-no-files-found: ignore
          retention-days: 2

      - uses: actions/upload-artifact@v7
        with:
          name: windows-quick-update
          path: dist/quick/*-update.zip
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Upload to the draft release
        if: inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = node -p "require('./package.json').version"
          $archive = (Resolve-Path "dist/quick/ai-drama-assistant-$version-update.zip").Path
          gh release upload $env:RELEASE_TAG $archive

  in-app-update-installer:
    if: always() && inputs.quick == 'true' && inputs.repack_from_installer_run != '' && (needs.quick-update.result == 'success' || inputs.quick_artifact_run != '')
    needs: quick-update
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: windows-quick-update
          path: dist/new-quick
          run-id: ${{ inputs.quick_artifact_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v7
        with:
          name: hongguo-windows
          run-id: ${{ inputs.repack_from_installer_run }}
          github-token: ${{ github.token }}
          path: dist/accepted-full
      - name: Repack accepted runtimes into an automatic-update installer
        id: repack
        shell: pwsh
        run: |
          node scripts/repack-auto-update.cjs dist/accepted-full dist/new-quick dist/auto-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist/auto-update/acceptance-paths.json)) { throw 'Repack did not produce its acceptance manifest' }
      - name: Exercise the real updater download and silent NSIS installation
        shell: pwsh
        run: |
          & ./node_modules/.bin/electron.cmd scripts/check-in-app-update-install.cjs dist/auto-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always() && steps.repack.outcome == 'success'
        with:
          name: windows-in-app-update-release
          path: |
            dist/auto-update/*-Setup-*.exe
            dist/auto-update/*.blockmap
            dist/auto-update/release-*.json
            dist/auto-update/latest.yml
            dist/auto-update/automatic-update-acceptance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  verify-native-download:
    if: inputs.native_verify_run != ''
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v7
        with:
          name: windows-quick-update
          run-id: ${{ inputs.native_verify_run }}
          github-token: ${{ github.token }}
          path: dist/packaged-download-test
      - name: Install the published Windows FFmpeg for full-media validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ff"
          gh release download v1.2.6 --repo "${{ github.repository }}" -p 'ffmpeg-*-win-x64.zip' -D "$RUNNER_TEMP/ff"
          (cd "$RUNNER_TEMP/ff" && 7z x -y -bd ffmpeg-*-win-x64.zip > /dev/null)
          ff=$(find "$RUNNER_TEMP/ff" -iname ffmpeg.exe | head -n 1)
          echo "FFMPEG_PATH=$(cygpath -w "$ff")" >> "$GITHUB_ENV"
          cygpath -w "$(dirname "$ff")" >> "$GITHUB_PATH"
      - name: Download and fully decode two episodes through the packaged app
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist/packaged-download-test/*-update.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath dist/packaged-download-test/stage
          node scripts/check-native-download.cjs dist/packaged-download-test/stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  verify-full-installer:
    if: inputs.installer_verify_run != ''
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: hongguo-windows
          run-id: ${{ inputs.installer_verify_run }}
          github-token: ${{ github.token }}
          path: dist/full-installer
      - name: Install and exercise the complete packaged application
        shell: pwsh
        run: ./scripts/check-installed-app.ps1 dist/full-installer
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installed-acceptance
          path: |
            dist/installed-acceptance.json
            dist/report-qa
          if-no-files-found: ignore

  publish-existing:
    if: inputs.artifact_run != '' && inputs.ffmpeg_only != 'true' && inputs.quick != 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Refuse the official v1.1.30 release
        if: inputs.tag == '' || inputs.tag == 'v1.1.30'
        shell: bash
        run: |
          echo "A release tag other than v1.1.30 is required to publish." >&2
          exit 1
      - uses: actions/download-artifact@v7
        with:
          name: hongguo-windows
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/win
      - name: Upload Windows assets to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upload"
          # 安装包必须有；zip 超过 GitHub 2 GiB 上限时在打包阶段已被跳过，这里有就带上；
          # 内置 FFmpeg 和它的完整源码包跟安装包一起发（许可要求）。
          for pattern in 'ai-drama-assistant-*-Setup.exe' 'ai-drama-assistant-*-win-x64.zip' 'ffmpeg-*-win-x64.zip' 'ffmpeg-*-win-x64-source.tar.xz'; do
            f=$(find "$RUNNER_TEMP/win" -path '*/release/*' -iname "$pattern" -print -quit)
            if [ -z "$f" ]; then
              f=$(find "$RUNNER_TEMP/win" -maxdepth 1 -iname "$pattern" -print -quit)
            fi
            if [ -z "$f" ]; then
              if [ "$pattern" = '*-Setup.exe' ]; then echo "missing $pattern" >&2; exit 1; fi
              echo "skip $pattern (not built or over 2 GiB)"
              continue
            fi
            cp "$f" "$RUNNER_TEMP/upload/"
          done
          (cd "$RUNNER_TEMP/upload" && sha256sum ai-drama-assistant-* > ai-drama-assistant-windows.sha256)
          sizes=$(ls -l "$RUNNER_TEMP/upload" | awk 'NR>1{printf "%s %s; ", $5, $9}')
          echo "::notice title=asset sizes::$sizes"
          if ! gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error title=发布页不存在::${{ inputs.tag }} 还没有发布页。用正常打包（不填 artifact_run）会自动新建。"
            exit 1
          fi
          failed=0
          for f in "$RUNNER_TEMP"/upload/*; do
            if ! gh release upload "${{ inputs.tag }}" "$f" --repo "${{ github.repository }}" --clobber > "$RUNNER_TEMP/up.log" 2>&1; then
              failed=1
              echo "::error title=upload $(basename "$f")::$(tail -n 8 "$RUNNER_TEMP/up.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            fi
          done
          exit $failed

  build-windows:
    if: inputs.artifact_run == '' && inputs.ffmpeg_only != 'true' && inputs.quick != 'true' && inputs.native_verify_run == '' && inputs.installer_verify_run == ''
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Refuse to publish a version number that was already released
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          # 每次更新都要换版本号：同一版本号已经发过安装包，就不再打包，免得分不清装的是哪一版。
          if gh release view "v${version}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "ai-drama-assistant-${version}-Setup.exe"; then
            echo "::error title=版本号已发布过::v${version} 已经有 Windows 安装包。请先在 package.json 里把版本号改成新的再打包。"
            exit 1
          fi
          if [ "${{ inputs.tag }}" != "v${version}" ]; then
            echo "::error title=发布页和版本号不一致::package.json 是 ${version}，发布页填的是 ${{ inputs.tag }}，应为 v${version}。"
            exit 1
          fi

      - run: npm ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and verify the app-local native playback resolver
        run: npm run setup:hongguo-player

      - name: Prepare and test the offline report conversion engine
        shell: pwsh
        run: |
          ./scripts/setup-libreoffice-win.ps1
          $office = Resolve-Path build/libreoffice/win32-x64/program/soffice.com
          $env:SAL_DISABLESKIA = '1'
          $version = Start-Process -FilePath $office -ArgumentList '--version' -WorkingDirectory (Split-Path $office) -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP/office-version.txt" -RedirectStandardError "$env:RUNNER_TEMP/office-version-errors.txt"
          if (!$version.WaitForExit(20000)) { Stop-Process -Id $version.Id -Force; throw 'Bundled LibreOffice did not start' }
          Get-Content "$env:RUNNER_TEMP/office-version.txt"
          if ($version.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP/office-version-errors.txt"; throw 'Bundled LibreOffice version probe failed' }
          & ./node_modules/.bin/electron.cmd scripts/check-office-png.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64

      - name: Bundle offline subtitle engine and tiny model
        shell: bash
        run: |
          set +e
          (npm run setup:transcription && npm run check:transcription-bundle) > "$RUNNER_TEMP/t.log" 2>&1
          code=$?
          if [ $code -ne 0 ]; then echo "::error title=transcription::$(tail -n 25 "$RUNNER_TEMP/t.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; fi
          exit $code

      - name: Bundle offline video structure runtime
        shell: bash
        run: |
          set +e
          (npm run setup:structure && npm run check:structure-bundle && npm run check:structure) > "$RUNNER_TEMP/s.log" 2>&1
          code=$?
          if [ $code -ne 0 ]; then echo "::error title=structure::$(tail -n 25 "$RUNNER_TEMP/s.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; fi
          exit $code

      - name: Bundle Jianying draft runtime
        shell: bash
        run: |
          set +e
          (npm run setup:jianying && node scripts/check-jianying-runtime.cjs && env -u PYTHONUTF8 node scripts/check-jianying-runtime-utf8.cjs) > "$RUNNER_TEMP/j.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/j.log"
          if [ $code -ne 0 ]; then echo "::error title=jianying::$(tail -n 25 "$RUNNER_TEMP/j.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; fi
          exit $code

      - name: Download tested Windows FFmpeg build artifact
        uses: actions/download-artifact@v7
        with:
          name: ffmpeg-9.0.2-nvenc11.1-win-x64
          run-id: 39368793098
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ffmpeg-compat

      - name: Verify and prepare pinned Windows FFmpeg
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'ffmpeg-compat'
          $archive = Get-ChildItem -LiteralPath $artifactDir -Filter 'ffmpeg-9.0.2-nvenc11.1-win-x64.zip' -File -Recurse | Select-Object -First 1
          $source = Get-ChildItem -LiteralPath $artifactDir -Filter 'ffmpeg-9.0.2-nvenc11.1-win-x64-source.tar.xz' -File -Recurse | Select-Object -First 1
          $checksums = Get-ChildItem -LiteralPath $artifactDir -Filter 'ffmpeg-9.0.2-nvenc11.1-win-x64.sha256' -File -Recurse | Select-Object -First 1
          $report = Get-ChildItem -LiteralPath $artifactDir -Filter 'BUILD-REPORT.txt' -File -Recurse | Select-Object -First 1
          if (!$archive -or !$source -or !$checksums -or !$report) { throw 'Windows FFmpeg build artifact is incomplete.' }
          $entries = Get-Content -LiteralPath $checksums.FullName
          foreach ($file in @($archive, $source)) {
            $line = $entries | Where-Object { $_ -match ('\s\*?' + [regex]::Escape($file.Name) + '$') } | Select-Object -First 1
            if (!$line) { throw "Missing archive checksum: $($file.Name)" }
            $expected = ($line -split '\s+')[0].ToLowerInvariant()
            $actual = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "SHA256 mismatch: $($file.Name)" }
          }
          $reportText = Get-Content -LiteralPath $report.FullName -Raw
          foreach ($required in @('NVENC API: 11.1', 'NVENCAPI_MAJOR_VERSION 11', 'NVENCAPI_MINOR_VERSION 1', 'h264_nvenc', 'h264_amf', 'h264_qsv')) {
            if ($reportText -notmatch [regex]::Escape($required)) { throw "Build report does not confirm $required" }
          }
          $expanded = Join-Path $env:RUNNER_TEMP 'ffmpeg-expanded'
          New-Item -ItemType Directory -Path $expanded -Force | Out-Null
          tar.exe -xf $archive.FullName -C $expanded
          $ffmpeg = Get-ChildItem -LiteralPath $expanded -Filter 'ffmpeg.exe' -File -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -LiteralPath $expanded -Filter 'ffprobe.exe' -File -Recurse | Select-Object -First 1
          if (!$ffmpeg -or !$ffprobe) { throw 'FFmpeg executables are missing from the build archive.' }
          $innerSums = Join-Path $ffmpeg.Directory.Parent.FullName 'SHA256SUMS'
          $innerEntries = Get-Content -LiteralPath $innerSums
          foreach ($item in @(@{ file = $ffmpeg; name = 'bin/ffmpeg.exe' }, @{ file = $ffprobe; name = 'bin/ffprobe.exe' })) {
            $line = $innerEntries | Where-Object { $_ -match ('\s\*?' + [regex]::Escape($item.name) + '$') } | Select-Object -First 1
            if (!$line) { throw "Missing executable checksum: $($item.name)" }
            $expected = ($line -split '\s+')[0].ToLowerInvariant()
            $actual = (Get-FileHash -LiteralPath $item.file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Executable SHA256 mismatch: $($item.name)" }
          }
          $dest = Join-Path $env:GITHUB_WORKSPACE 'build/ffmpeg'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $reported = (& $ffmpeg.FullName -version | Select-Object -First 1)
          if ($reported -notmatch 'ffmpeg version 9\.0\.2-aidrama-nvenc11\.1(\s|$)') { throw "FFmpeg version is not the pinned NVENC 11.1 build: $reported" }
          Copy-Item -LiteralPath $ffmpeg.FullName -Destination (Join-Path $dest 'ffmpeg.exe') -Force
          Copy-Item -LiteralPath $ffprobe.FullName -Destination (Join-Path $dest 'ffprobe.exe') -Force
          Copy-Item -LiteralPath $innerSums -Destination (Join-Path $dest 'SHA256SUMS') -Force
          Copy-Item -LiteralPath $report.FullName -Destination (Join-Path $dest 'BUILD-REPORT.txt') -Force
          Get-ChildItem -LiteralPath $ffmpeg.Directory.Parent.FullName -Filter '*.txt' -File -Recurse | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $dest $_.Name) -Force }
          $sourceList = Get-ChildItem -LiteralPath $ffmpeg.Directory.Parent.FullName -Filter 'SOURCES.txt' -File -Recurse | Select-Object -First 1
          if ($sourceList) { Copy-Item -LiteralPath $sourceList.FullName -Destination (Join-Path $dest 'SOURCES.txt') -Force }
          $build = @{
            version = '9.0.2'
            buildVersion = '9.0.2-aidrama-nvenc11.1'
            url = 'https://github.com/XASDSdsa/hongguo-drama-mac/releases/download/v1.2.0/ffmpeg-9.0.2-nvenc11.1-win-x64.zip'
            sha256 = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            binaries = @{
              'ffmpeg.exe' = (Get-FileHash -LiteralPath $ffmpeg.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              'ffprobe.exe' = (Get-FileHash -LiteralPath $ffprobe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $json = $build | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText((Join-Path $dest 'WINDOWS-BUILD.json'), $json, [System.Text.UTF8Encoding]::new($false))
          node scripts/check-ffmpeg-setup.cjs
          node scripts/setup-ffmpeg.js

      - name: Check processing with bundled Windows FFmpeg
        shell: bash
        run: |
          ffdir="$(cygpath -u "$GITHUB_WORKSPACE")/build/ffmpeg"
          export PATH="$ffdir:$PATH"
          export FFMPEG_PATH="$GITHUB_WORKSPACE\\build\\ffmpeg\\ffmpeg.exe"
          export FFPROBE_PATH="$GITHUB_WORKSPACE\\build\\ffmpeg\\ffprobe.exe"
          ffmpeg -hide_banner -version | head -n 1
          # 每条检查失败时，把输出末尾写成注释，不用打开完整日志就能看到原因。
          run_check() {
            if ! "$@" > check.out 2>&1; then
              cat check.out
              echo "::error title=$*::$(tail -n 25 check.out | head -c 3500 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
              exit 1
            fi
            cat check.out
          }
          run_check node scripts/check-quchong.cjs
          run_check node scripts/check-quchong-size.cjs
          run_check node scripts/check-quchong-sources.cjs
          run_check node scripts/check-dedup-defaults.cjs
          run_check node scripts/check-resplit.cjs
          run_check node scripts/check-dedup-timestamps.cjs
          run_check node scripts/check-scene-hwaccel.cjs
          run_check node scripts/check-jianying-relink.cjs
          run_check node scripts/check-jianying-location.cjs
          run_check node scripts/check-separation-ascii.cjs
          run_check env REQUIRE_STRUCTURE_RUNTIME=1 node scripts/check-separation-real.cjs
          # 关键帧去字幕：用打包进软件的运行时和 big-lama 真跑一遍（装不上、跑不了就不发）
          run_check env REQUIRE_LAMA=1 node scripts/check-lama-subtitle.cjs
          # 端到端：原剧 → 重新拆分去重 → 分析 → 三分轨 / 多分轨剪映草稿，中文剧名和文件夹，全用打包进软件的组件。
          run_check env REQUIRE_E2E=1 node scripts/check-draft-e2e.cjs

      - name: Build local whisper.cpp and prepare tiny model
        shell: bash
        run: |
          set -euo pipefail
          WHISPER_REF=v1.9.3
          src="$RUNNER_TEMP/whisper.cpp"
          build="$RUNNER_TEMP/whisper-build"
          git clone --depth 1 --branch "$WHISPER_REF" https://github.com/ggml-org/whisper.cpp.git "$src"
          cmake -S "$src" -B "$build" -A x64 -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DGGML_OPENMP=OFF -DGGML_SSE42=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_BMI2=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build "$build" --config Release --target whisper-cli
          bin=$(find "$build" -type f -iname whisper-cli.exe | head -n 1)
          test -n "$bin"
          mkdir -p build/whisper/win32-x64 build/whisper/models
          curl -L --retry 4 --fail https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin -o build/whisper/models/ggml-tiny.bin
          echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  build/whisper/models/ggml-tiny.bin" | sha256sum -c -
          cp "$src/LICENSE" build/whisper/WHISPER-LICENSE.txt
          WHISPER_CPP_BIN="$bin" WHISPER_CPP_MODEL="$PWD/build/whisper/models/ggml-tiny.bin" node scripts/setup-whisper.js

      - name: Run Windows-safe checks
        shell: bash
        run: |
          set -e
          # 哪一项检查失败，就把那条命令写进打包页面的提示里（日志看不到时也能一眼知道是谁）。
          trap 'echo "::error title=检查失败::$BASH_COMMAND"' ERR
          node scripts/check-undefined-names.cjs
          node scripts/check-hot-rank-live.cjs
          node scripts/check-catalog.cjs
          node scripts/check-download-series.cjs
          node scripts/check-download-errors.cjs
          node scripts/check-pagination.cjs
          node scripts/check-library-activity.cjs
          node scripts/check-download-safety.cjs
          node scripts/check-series-episode-panel.cjs
          node scripts/check-renderer-lifecycle.cjs
          node scripts/check-quit-confirm.cjs
          node scripts/check-download-index.cjs
          node scripts/check-series-library.cjs
          node scripts/check-device-license.cjs
          node scripts/check-series-delivery.cjs
          node scripts/check-cost-report.cjs
          node scripts/check-seedream.cjs
          node scripts/check-ai-config.cjs
          node scripts/check-draft-lanes.cjs
          node scripts/check-draft-capacity.cjs
          node scripts/check-storyboard-reuse.cjs
          node scripts/check-originals-folder.cjs
          node scripts/check-app-rename.cjs
          node scripts/check-ai-network-errors.cjs
          REQUIRE_WHISPER=1 node scripts/check-whisper-real.cjs
          # 三分轨草稿用打包剪映运行时的同一个 Python 环境真跑一遍（含 pyJianYingDraft），不跳过。
          JY_PY="$PWD/.cache/jianying-venv/Scripts/python.exe"
          if [ -f "$JY_PY" ]; then
            PYTHON="$JY_PY" FFMPEG_PATH="$PWD/build/ffmpeg/ffmpeg.exe" REQUIRE_JIANYING=1 node scripts/check-jianying-simple-draft.cjs
          else
            node scripts/check-jianying-simple-draft.cjs
          fi
          node scripts/check-quchong-queue.cjs
          node scripts/check-pipeline-gate.cjs
          node scripts/check-whisper-adapter.cjs
          npm run check:ai

      - name: Build React assets and title fonts
        shell: bash
        run: |
          npm run setup:title-fonts
          npm run build:react

      - name: Build NSIS installer
        shell: bash
        run: |
          set +e
          npx electron-builder --win nsis --x64 --publish never > "$RUNNER_TEMP/nsis.log" 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(tail -n 25 "$RUNNER_TEMP/nsis.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=NSIS build log::$msg"
          fi
          exit $code

      # GitHub 发布页每个文件必须小于 2 GiB：超了在这里就停，说清楚，不等到最后上传才失败
      - name: Installer must stay under the 2 GiB release asset limit
        if: inputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail
          f=$(ls dist/*-Setup-*.exe | head -n 1)  # electron-builder 出的是「AI短剧助手-Setup-版本号.exe」
          size=$(stat -c %s "$f")
          echo "::notice title=安装包大小::$(basename "$f") ${size} 字节（$((size / 1048576)) MiB，上限 2048 MiB）"
          if [ "$size" -ge 2147483648 ]; then
            echo "::error title=安装包超过 2 GiB::$(basename "$f") 有 ${size} 字节，GitHub 发布页传不上去"
            exit 1
          fi

      # 不再出便携版：它每次打开都要先把几个 GB 解压到临时文件夹（再被杀毒软件逐个扫描），要等好几分钟。
      - name: Build unpacked directory and zip
        if: inputs.installer_only != 'true'
        shell: bash
        run: |
          npx electron-builder --win --dir --x64 --publish never
          node scripts/make-zip.js

      - name: Check package integrity settings and measure the activation window
        shell: bash
        run: |
          set -euo pipefail
          exe=$(find dist/win-unpacked -maxdepth 1 -iname '*.exe' ! -iname '*uninstall*' | head -n 1)
          [ -n "$exe" ] || { echo "no app exe in dist/win-unpacked" >&2; exit 1; }
          node - "$(cygpath -w "$exe")" <<'NODE'
          const assert = require('node:assert/strict');
          const { getCurrentFuseWire, FuseV1Options } = require('@electron/fuses');
          getCurrentFuseWire(process.argv[2]).then((wire) => {
            for (const option of ['EnableEmbeddedAsarIntegrityValidation', 'OnlyLoadAppFromAsar']) {
              assert.equal(wire[FuseV1Options[option]], 49, option);
            }
            for (const option of ['RunAsNode', 'EnableNodeOptionsEnvironmentVariable', 'EnableNodeCliInspectArguments']) {
              assert.equal(wire[FuseV1Options[option]], 48, option);
            }
          }).catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
          for run in 1 2; do
            out="$RUNNER_TEMP/startup-$run.json"
            rm -f "$out"
            AI_DRAMA_STARTUP_PROBE="$(cygpath -w "$out")" "$exe" > "$RUNNER_TEMP/startup-$run.log" 2>&1 &
            pid=$!
            for i in $(seq 1 120); do [ -s "$out" ] && break; sleep 1; done
            wait "$pid" || true
            [ -s "$out" ] || { echo "the app did not open within 120 s (run $run)" >&2; cat "$RUNNER_TEMP/startup-$run.log" >&2 || true; exit 1; }
            echo "run $run: $(cat "$out")"
            echo "::notice title=startup run $run (ms since process start)::$(cat "$out")"
          done
          # 运行器不持有激活码，必须先看到授权窗，且不能进入主界面。
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); if(!(r.activationLoaded<15000)||r.pageLoaded!=null){console.error('unexpected startup result',r);process.exit(1)}" "$(cygpath -w "$RUNNER_TEMP/startup-2.json")"

      - name: Check PNG export from the packaged offline report engine
        run: npx --no-install electron scripts/check-office-png.cjs dist/win-unpacked/resources/LibreOffice

      - name: Prepare release assets
        env:
          SELF_HOSTED_UPDATES: ${{ inputs.tag == '' && '1' || '0' }}
        run: node scripts/prepare-release-assets.js

      - name: Prepare the matching self-hosted update metadata
        run: node scripts/make-update-release.cjs dist

      - uses: actions/upload-artifact@v7
        with:
          name: windows-in-app-update-release
          path: |
            dist/*-Setup-*.exe
            dist/*.blockmap
            dist/release-*.json
            dist/latest.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Add the bundled FFmpeg and its complete source to the release assets
        shell: bash
        run: |
          set -euo pipefail
          src="$(cygpath -u "$RUNNER_TEMP")/ffmpeg-compat"
          # GPL：随软件分发的 FFmpeg 要同时提供完整对应源码。
          for f in ffmpeg-9.0.2-nvenc11.1-win-x64-source.tar.xz ffmpeg-9.0.2-nvenc11.1-win-x64.zip; do
            p=$(find "$src" -name "$f" | head -n 1)
            [ -n "$p" ] || { echo "missing $f" >&2; exit 1; }
            cp "$p" dist/release/
          done

      - name: List build output
        shell: bash
        run: |
          ls -la dist dist/release || true

      - uses: actions/upload-artifact@v6
        with:
          name: hongguo-windows
          path: |
            dist/release/*
          if-no-files-found: error

      - name: Upload Windows assets to the release
        if: inputs.tag != '' && inputs.tag != 'v1.1.30'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist/release && sha256sum ai-drama-assistant-* > ai-drama-assistant-windows.sha256)
          version=$(node -p "require('./package.json').version")
          bash scripts/create-release-page.sh "${{ inputs.tag }}" "AI短剧助手 ${version}" "AI短剧助手 ${version}（软件代码 ${GITHUB_SHA}）。"
          gh release upload "${{ inputs.tag }}" dist/release/* --repo "${{ github.repository }}" --clobber

      - name: Check packaged subtitle engine without system Python
        run: node scripts/check-bundled-transcription.cjs dist/win-unpacked/resources
