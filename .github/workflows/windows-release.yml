name: Windows build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build.
        required: false
        default: ''
      tag:
        description: Existing GitHub release tag to receive the Windows assets (empty = keep only a workflow artifact). Never v1.1.30.
        required: false
        default: ''
      artifact_run:
        description: Skip the build; publish the hongguo-windows artifact of this earlier run id to the tag.
        required: false
        default: ''
      ffmpeg_only:
        description: "Only build the bundled Windows FFmpeg (NVENC 11.1, NVIDIA driver 471.41+) and keep it as an artifact."
        required: false
        default: ''

permissions:
  actions: read
  contents: write

jobs:
  build-ffmpeg:
    if: inputs.ffmpeg_only == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0

      - name: Install native compiler tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git curl tar gzip xz zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf

      - name: Build static FFmpeg from pinned sources
        id: helpers
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg-source-win.sh /c/ffmpeg-compat-build 4

      - name: Exercise real Windows processing with the new FFmpeg
        shell: bash
        env:
          FFMPEG_PATH: C:/ffmpeg-compat-build/artifacts/ffmpeg-9.0.2-nvenc11.1-win-x64/bin/ffmpeg.exe
          FFPROBE_PATH: C:/ffmpeg-compat-build/artifacts/ffmpeg-9.0.2-nvenc11.1-win-x64/bin/ffprobe.exe
        run: |
          set -e
          npm ci --ignore-scripts
          export PATH="/c/ffmpeg-compat-build/artifacts/ffmpeg-9.0.2-nvenc11.1-win-x64/bin:$PATH"
          "$FFMPEG_PATH" -hide_banner -version | head -n 1
          # 没有 NVIDIA 显卡的打包机上，NVENC 试编应报「找不到驱动」，而不是参数错误。
          "$FFMPEG_PATH" -hide_banner -v error -f lavfi -i color=c=black:s=256x256:d=0.2 -frames:v 1 -pix_fmt yuv420p -c:v h264_nvenc -preset p1 -cq 21 -f null - 2>&1 | head -n 5 || true
          node scripts/check-quchong.cjs
          node scripts/check-dedup-timestamps.cjs
          node scripts/check-resplit.cjs

      - name: Keep binaries and corresponding source
        if: always() && steps.helpers.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-9.0.2-nvenc11.1-win-x64
          path: |
            C:/ffmpeg-compat-build/artifacts/*.zip
            C:/ffmpeg-compat-build/artifacts/*.tar.xz
            C:/ffmpeg-compat-build/artifacts/*.sha256
            C:/ffmpeg-compat-build/artifacts/*/BUILD-REPORT.txt
          if-no-files-found: error
          retention-days: 90

      - name: Keep build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-compat-build-logs
          path: |
            C:/ffmpeg-compat-build/logs
            C:/ffmpeg-compat-build/build-ffmpeg/ffbuild/config.log
          if-no-files-found: ignore

  publish-existing:
    if: inputs.artifact_run != '' && inputs.ffmpeg_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Refuse the official v1.1.30 release
        if: inputs.tag == '' || inputs.tag == 'v1.1.30'
        shell: bash
        run: |
          echo "A release tag other than v1.1.30 is required to publish." >&2
          exit 1
      - uses: actions/download-artifact@v7
        with:
          name: hongguo-windows
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/win
      - name: Upload Windows assets to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upload"
          # 安装包必须有；zip / 便携版超过 GitHub 2 GiB 上限时在打包阶段已被跳过，这里有就带上。
          for pattern in '*-Setup.exe' '*-win-x64.zip' '*-portable.exe'; do
            f=$(find "$RUNNER_TEMP/win" -path '*/release/*' -iname "ai-drama-assistant-*$pattern" | head -n 1)
            if [ -z "$f" ]; then
              if [ "$pattern" = '*-Setup.exe' ]; then echo "missing $pattern" >&2; exit 1; fi
              echo "skip $pattern (not built or over 2 GiB)"
              continue
            fi
            cp "$f" "$RUNNER_TEMP/upload/"
          done
          (cd "$RUNNER_TEMP/upload" && sha256sum * > ai-drama-assistant-windows.sha256)
          sizes=$(ls -l "$RUNNER_TEMP/upload" | awk 'NR>1{printf "%s %s; ", $5, $9}')
          echo "::notice title=asset sizes::$sizes"
          gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create "${{ inputs.tag }}" --repo "${{ github.repository }}" --prerelease --title "${{ inputs.tag }}" --notes "Windows build from ${GITHUB_SHA}."
          failed=0
          for f in "$RUNNER_TEMP"/upload/*; do
            if ! gh release upload "${{ inputs.tag }}" "$f" --repo "${{ github.repository }}" --clobber > "$RUNNER_TEMP/up.log" 2>&1; then
              failed=1
              echo "::error title=upload $(basename "$f")::$(tail -n 8 "$RUNNER_TEMP/up.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            fi
          done
          exit $failed

  build-windows:
    if: inputs.artifact_run == '' && inputs.ffmpeg_only != 'true'
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64

      - name: Bundle offline subtitle engine and tiny model
        shell: bash
        run: |
          set +e
          (npm run setup:transcription && npm run check:transcription-bundle) > "$RUNNER_TEMP/t.log" 2>&1
          code=$?
          if [ $code -ne 0 ]; then echo "::error title=transcription::$(tail -n 25 "$RUNNER_TEMP/t.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; fi
          exit $code

      - name: Bundle offline video structure runtime
        shell: bash
        run: |
          set +e
          (npm run setup:structure && npm run check:structure-bundle && npm run check:structure) > "$RUNNER_TEMP/s.log" 2>&1
          code=$?
          if [ $code -ne 0 ]; then echo "::error title=structure::$(tail -n 25 "$RUNNER_TEMP/s.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; fi
          exit $code

      - name: Bundle Jianying draft runtime
        shell: bash
        run: |
          set +e
          (npm run setup:jianying && node scripts/check-jianying-runtime.cjs && env -u PYTHONUTF8 node scripts/check-jianying-runtime-utf8.cjs) > "$RUNNER_TEMP/j.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/j.log"
          if [ $code -ne 0 ]; then echo "::error title=jianying::$(tail -n 25 "$RUNNER_TEMP/j.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; fi
          exit $code

      - name: Download tested Windows FFmpeg build artifact
        uses: actions/download-artifact@v7
        with:
          name: ffmpeg-9.0.2-nvenc11.1-win-x64
          run-id: 39368793098
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ffmpeg-compat

      - name: Verify and prepare pinned Windows FFmpeg
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'ffmpeg-compat'
          $archive = Get-ChildItem -LiteralPath $artifactDir -Filter 'ffmpeg-9.0.2-nvenc11.1-win-x64.zip' -File -Recurse | Select-Object -First 1
          $source = Get-ChildItem -LiteralPath $artifactDir -Filter 'ffmpeg-9.0.2-nvenc11.1-win-x64-source.tar.xz' -File -Recurse | Select-Object -First 1
          $checksums = Get-ChildItem -LiteralPath $artifactDir -Filter 'ffmpeg-9.0.2-nvenc11.1-win-x64.sha256' -File -Recurse | Select-Object -First 1
          $report = Get-ChildItem -LiteralPath $artifactDir -Filter 'BUILD-REPORT.txt' -File -Recurse | Select-Object -First 1
          if (!$archive -or !$source -or !$checksums -or !$report) { throw 'Windows FFmpeg build artifact is incomplete.' }
          $entries = Get-Content -LiteralPath $checksums.FullName
          foreach ($file in @($archive, $source)) {
            $line = $entries | Where-Object { $_ -match ('\s\*?' + [regex]::Escape($file.Name) + '$') } | Select-Object -First 1
            if (!$line) { throw "Missing archive checksum: $($file.Name)" }
            $expected = ($line -split '\s+')[0].ToLowerInvariant()
            $actual = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "SHA256 mismatch: $($file.Name)" }
          }
          $reportText = Get-Content -LiteralPath $report.FullName -Raw
          foreach ($required in @('NVENC API: 11.1', 'NVENCAPI_MAJOR_VERSION 11', 'NVENCAPI_MINOR_VERSION 1', 'h264_nvenc', 'h264_amf', 'h264_qsv')) {
            if ($reportText -notmatch [regex]::Escape($required)) { throw "Build report does not confirm $required" }
          }
          $expanded = Join-Path $env:RUNNER_TEMP 'ffmpeg-expanded'
          New-Item -ItemType Directory -Path $expanded -Force | Out-Null
          tar.exe -xf $archive.FullName -C $expanded
          $ffmpeg = Get-ChildItem -LiteralPath $expanded -Filter 'ffmpeg.exe' -File -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -LiteralPath $expanded -Filter 'ffprobe.exe' -File -Recurse | Select-Object -First 1
          if (!$ffmpeg -or !$ffprobe) { throw 'FFmpeg executables are missing from the build archive.' }
          $innerSums = Join-Path $ffmpeg.Directory.Parent.FullName 'SHA256SUMS'
          $innerEntries = Get-Content -LiteralPath $innerSums
          foreach ($item in @(@{ file = $ffmpeg; name = 'bin/ffmpeg.exe' }, @{ file = $ffprobe; name = 'bin/ffprobe.exe' })) {
            $line = $innerEntries | Where-Object { $_ -match ('\s\*?' + [regex]::Escape($item.name) + '$') } | Select-Object -First 1
            if (!$line) { throw "Missing executable checksum: $($item.name)" }
            $expected = ($line -split '\s+')[0].ToLowerInvariant()
            $actual = (Get-FileHash -LiteralPath $item.file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Executable SHA256 mismatch: $($item.name)" }
          }
          $dest = Join-Path $env:GITHUB_WORKSPACE 'build/ffmpeg'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $reported = (& $ffmpeg.FullName -version | Select-Object -First 1)
          if ($reported -notmatch 'ffmpeg version 9\.0\.2-aidrama-nvenc11\.1(\s|$)') { throw "FFmpeg version is not the pinned NVENC 11.1 build: $reported" }
          Copy-Item -LiteralPath $ffmpeg.FullName -Destination (Join-Path $dest 'ffmpeg.exe') -Force
          Copy-Item -LiteralPath $ffprobe.FullName -Destination (Join-Path $dest 'ffprobe.exe') -Force
          Copy-Item -LiteralPath $innerSums -Destination (Join-Path $dest 'SHA256SUMS') -Force
          Copy-Item -LiteralPath $report.FullName -Destination (Join-Path $dest 'BUILD-REPORT.txt') -Force
          Get-ChildItem -LiteralPath $ffmpeg.Directory.Parent.FullName -Filter '*.txt' -File -Recurse | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $dest $_.Name) -Force }
          $sourceList = Get-ChildItem -LiteralPath $ffmpeg.Directory.Parent.FullName -Filter 'SOURCES.txt' -File -Recurse | Select-Object -First 1
          if ($sourceList) { Copy-Item -LiteralPath $sourceList.FullName -Destination (Join-Path $dest 'SOURCES.txt') -Force }
          $build = @{
            version = '9.0.2'
            buildVersion = '9.0.2-aidrama-nvenc11.1'
            url = 'https://github.com/XASDSdsa/hongguo-drama-mac/releases/download/v1.1.41-breath-on-shot/ffmpeg-9.0.2-nvenc11.1-win-x64.zip'
            sha256 = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            binaries = @{
              'ffmpeg.exe' = (Get-FileHash -LiteralPath $ffmpeg.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              'ffprobe.exe' = (Get-FileHash -LiteralPath $ffprobe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $json = $build | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText((Join-Path $dest 'WINDOWS-BUILD.json'), $json, [System.Text.UTF8Encoding]::new($false))
          node scripts/check-ffmpeg-setup.cjs
          node scripts/setup-ffmpeg.js

      - name: Check processing with bundled Windows FFmpeg
        shell: bash
        run: |
          ffdir="$(cygpath -u "$GITHUB_WORKSPACE")/build/ffmpeg"
          export PATH="$ffdir:$PATH"
          export FFMPEG_PATH="$GITHUB_WORKSPACE\\build\\ffmpeg\\ffmpeg.exe"
          export FFPROBE_PATH="$GITHUB_WORKSPACE\\build\\ffmpeg\\ffprobe.exe"
          ffmpeg -hide_banner -version | head -n 1
          # 每条检查失败时，把输出末尾写成注释，不用打开完整日志就能看到原因。
          run_check() {
            if ! "$@" > check.out 2>&1; then
              cat check.out
              echo "::error title=$*::$(tail -n 25 check.out | head -c 3500 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
              exit 1
            fi
            cat check.out
          }
          run_check node scripts/check-quchong.cjs
          run_check node scripts/check-quchong-size.cjs
          run_check node scripts/check-quchong-sources.cjs
          run_check node scripts/check-dedup-defaults.cjs
          run_check node scripts/check-resplit.cjs
          run_check node scripts/check-dedup-timestamps.cjs
          run_check node scripts/check-separation-ascii.cjs
          run_check env REQUIRE_STRUCTURE_RUNTIME=1 node scripts/check-separation-real.cjs

      - name: Build local whisper.cpp and prepare tiny model
        shell: bash
        run: |
          set -euo pipefail
          WHISPER_REF=v1.9.3
          src="$RUNNER_TEMP/whisper.cpp"
          build="$RUNNER_TEMP/whisper-build"
          git clone --depth 1 --branch "$WHISPER_REF" https://github.com/ggml-org/whisper.cpp.git "$src"
          cmake -S "$src" -B "$build" -A x64 -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DGGML_OPENMP=OFF -DGGML_SSE42=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_BMI2=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build "$build" --config Release --target whisper-cli
          bin=$(find "$build" -type f -iname whisper-cli.exe | head -n 1)
          test -n "$bin"
          mkdir -p build/whisper/win32-x64 build/whisper/models
          curl -L --retry 4 --fail https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin -o build/whisper/models/ggml-tiny.bin
          echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  build/whisper/models/ggml-tiny.bin" | sha256sum -c -
          cp "$src/LICENSE" build/whisper/WHISPER-LICENSE.txt
          WHISPER_CPP_BIN="$bin" WHISPER_CPP_MODEL="$PWD/build/whisper/models/ggml-tiny.bin" node scripts/setup-whisper.js

      - name: Run Windows-safe checks
        shell: bash
        run: |
          set -e
          node scripts/check-download-series.cjs
          node scripts/check-download-errors.cjs
          node scripts/check-pagination.cjs
          node scripts/check-library-activity.cjs
          node scripts/check-download-safety.cjs
          node scripts/check-series-episode-panel.cjs
          node scripts/check-renderer-lifecycle.cjs
          node scripts/check-quit-confirm.cjs
          node scripts/check-download-index.cjs
          node scripts/check-series-library.cjs
          node scripts/check-draft-lanes.cjs
          node scripts/check-storyboard-reuse.cjs
          node scripts/check-originals-folder.cjs
          node scripts/check-app-rename.cjs
          node scripts/check-ai-network-errors.cjs
          # 三分轨草稿用打包剪映运行时的同一个 Python 环境真跑一遍（含 pyJianYingDraft），不跳过。
          JY_PY="$PWD/.cache/jianying-venv/Scripts/python.exe"
          if [ -f "$JY_PY" ]; then
            PYTHON="$JY_PY" FFMPEG_PATH="$PWD/build/ffmpeg/ffmpeg.exe" REQUIRE_JIANYING=1 node scripts/check-jianying-simple-draft.cjs
          else
            node scripts/check-jianying-simple-draft.cjs
          fi
          node scripts/check-quchong-queue.cjs
          node scripts/check-pipeline-gate.cjs
          node scripts/check-whisper-adapter.cjs
          npm run check:ai

      - name: Build React assets and title fonts
        shell: bash
        run: |
          npm run setup:title-fonts
          npm run build:react

      - name: Build NSIS installer
        shell: bash
        run: |
          set +e
          npx electron-builder --win nsis --x64 --publish never > "$RUNNER_TEMP/nsis.log" 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(tail -n 25 "$RUNNER_TEMP/nsis.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=NSIS build log::$msg"
          fi
          exit $code

      - name: Build portable executable
        run: npx electron-builder --win portable --x64 --publish never

      - name: Build unpacked directory and zip
        shell: bash
        run: |
          npx electron-builder --win --dir --x64 --publish never
          node scripts/make-zip.js

      - name: Prepare release assets
        run: node scripts/prepare-release-assets.js

      - name: Add the bundled FFmpeg and its complete source to the release assets
        shell: bash
        run: |
          set -euo pipefail
          src="$(cygpath -u "$RUNNER_TEMP")/ffmpeg-compat"
          # GPL：随软件分发的 FFmpeg 要同时提供完整对应源码。
          for f in ffmpeg-9.0.2-nvenc11.1-win-x64-source.tar.xz ffmpeg-9.0.2-nvenc11.1-win-x64.zip; do
            p=$(find "$src" -name "$f" | head -n 1)
            [ -n "$p" ] || { echo "missing $f" >&2; exit 1; }
            cp "$p" dist/release/
          done

      - name: List build output
        shell: bash
        run: |
          ls -la dist dist/release || true

      - uses: actions/upload-artifact@v6
        with:
          name: hongguo-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/release/*
          if-no-files-found: error

      - name: Upload Windows assets to the release
        if: inputs.tag != '' && inputs.tag != 'v1.1.30'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist/release && sha256sum ai-drama-assistant-* > ai-drama-assistant-windows.sha256)
          if gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ inputs.tag }}" dist/release/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "${{ inputs.tag }}" dist/release/* --repo "${{ github.repository }}" --prerelease --title "${{ inputs.tag }}" --notes "Windows build from ${GITHUB_SHA}."
          fi

      - name: Check packaged subtitle engine without system Python
        run: node scripts/check-bundled-transcription.cjs dist/win-unpacked/resources
