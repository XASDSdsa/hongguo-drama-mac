name: Windows processing checks

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - src/native/quchong.js
      - scripts/check-quchong.cjs
      - scripts/setup-ffmpeg.js
      - scripts/check-ffmpeg-setup.cjs
      - src/native/faster-whisper.js
      - src/native/faster_whisper_cli.py
      - src/native/transcription-manager.js
      - src/native/srt.js
      - scripts/check-subtitle-*
      - scripts/check-transcription-manager.cjs
      - .github/workflows/windows-processing-checks.yml

permissions:
  contents: read

jobs:
  check-processing:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0

      - name: Prepare bundled Windows FFmpeg
        run: |
          node scripts/check-ffmpeg-setup.cjs
          node scripts/setup-ffmpeg.js

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Hosted runners do not expose NVENC, AMF or QSV hardware. These checks
      # exercise real media, filters, CPU encoding, MP4 output and cancellation.
      - name: Check processing with bundled Windows FFmpeg
        env:
          FFMPEG_PATH: ${{ github.workspace }}/build/ffmpeg/ffmpeg.exe
          FFPROBE_PATH: ${{ github.workspace }}/build/ffmpeg/ffprobe.exe
        shell: bash
        run: |
          "$FFMPEG_PATH" -version
          node scripts/check-quchong.cjs
          npm run check:subtitles
          python scripts/check-subtitle-alignment.py
