<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>changeFileName 管理后台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172337;font:15px system-ui}main{max-width:900px;margin:40px auto;padding:0 24px}nav{display:flex;gap:20px;margin:20px 0}a{color:#2357b5}section{background:white;border:1px solid #dbe1eb;border-radius:12px;padding:24px;margin:20px 0}h1{font-size:26px}h2{font-size:20px;margin-top:0}p{line-height:1.7}button,input{font:inherit}button{padding:10px 18px;border:1px solid #c4cddb;border-radius:7px;background:#2357b5;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}input{max-width:100%;margin:12px 0}progress{width:100%}#message{white-space:pre-wrap}table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;border-bottom:1px solid #e0e5ef;text-align:left;vertical-align:top}td.notes{white-space:pre-wrap;overflow-wrap:anywhere;max-width:400px}.muted{color:#5d6b7e}.error{color:#b32a35}
</style>
<main><h1>changeFileName 管理后台</h1><nav><a href="/admin">授权管理</a><a href="/admin/updates">软件更新</a></nav>
<section><h2>当前发布</h2><p id="active">正在读取…</p><button id="withdraw" hidden>撤回当前更新</button><p class="muted">撤回后停止提示该更新，已安装用户保留当前版本。需要修复时发布更高版本。</p></section>
<section><h2>上传并发布新版本</h2><p>选择同一次构建的三个文件：<strong>安装程序 .exe、.exe.blockmap、release-版本号.json</strong>。上传完成后核对版本，再点发布。</p>
<input id="files" type="file" multiple accept=".exe,.blockmap,.json" aria-label="选择更新文件"><br>
<label for="notes">更新说明（用户会在软件里看到）</label><br>
<textarea id="notes" rows="3" maxlength="10000" style="width:100%;margin:10px 0;padding:10px;font:inherit" placeholder="填写这次改进或修复的内容"></textarea><br>
<button id="upload">上传文件</button> <button id="publish" disabled>发布上传的版本</button>
<p id="message" role="status" aria-live="polite"></p><progress id="progress" value="0" max="100" hidden></progress>
</section><section><h2>已上传的发布版本</h2><table><thead><tr><th>版本</th><th>更新说明</th><th>操作</th></tr></thead><tbody id="versions"></tbody></table></section>
<p class="muted">首次需手动安装带更新器的版本。之后用户可在软件左下角检查更新、下载并重启安装，授权、设置和模板会保留。</p></main><script src="/admin/updates/ui.js"></script></html>
